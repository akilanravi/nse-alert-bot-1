name: 5M Telegram Alert Scanner

on:
  schedule:
    # Runs every 5 minutes from 4:00 AM to 9:45 AM UTC (9:30 AM to 3:15 PM IST), Mon-Fri
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Alert Check
        run: |
          python bot.py
