name: F&O Telegram Scanner

on:
  # UTC: 04:00–09:55 = 09:30–15:25 IST. Python gates scans to 15:15 IST.
  # GitHub schedules are best-effort and may be delayed or skipped.
  schedule:
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a Telegram connection test instead of scanning'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fo-telegram-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '0' }}
        run: python bot.py
      - name: Persist alert de-duplication state
        if: ${{ always() && github.event_name != 'workflow_dispatch' }}
        run: |
          if [[ -n "$(git status --porcelain trade_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trade_state.json
            git commit -m "Update scanner alert state [skip ci]"
            git push
          fi
