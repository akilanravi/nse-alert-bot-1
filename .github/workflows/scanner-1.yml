name: F&O Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 4-8 * * 1-5'
    - cron: '0-45/5 9 * * 1-5'

permissions:
  contents: read

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas numpy pytz requests

      - name: Run scanner
        run: python bot.py

