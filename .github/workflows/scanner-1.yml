name: 5M Telegram Alert Scanner

on:
  schedule:
    # 1. Runs every 5 mins from 3:45 AM to 3:55 AM UTC (9:15 AM - 9:25 AM IST)
    - cron: '45,50,55 3 * * 1-5'
    # 2. Runs every 5 mins from 4:00 AM to 10:00 AM UTC (9:30 AM - 3:30 PM IST)
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Alert Check
        run: |
          python bot.py

      - name: Commit Updated Trailing State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json || true
          git diff --staged --quiet || git commit -m "Update active trailing SL state [skip ci]"
          git push || true
