name: 5M Telegram Alert Scanner
# Public activation trigger

on:
  schedule:
    # Every 5 minutes, 03:00-10:55 UTC (8:30 AM-4:25 PM IST), Mon-Fri.
    # bot.py itself only acts between 9:15 AM and 3:30 PM IST.
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Send a Telegram test message only (true/false)'
        required: false
        default: 'false'
      force_run:
        description: 'Ignore market hours and run a full scan (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

# Prevent overlapping runs from clashing on trade_state.json
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Alert Check
        env:
          TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_message == 'true' && '1' || '0' }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
        run: python bot.py

      - name: Save Trailing State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update active trailing state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi
