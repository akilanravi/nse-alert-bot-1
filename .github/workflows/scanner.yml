name: Multi-Strategy Scanner Matrix

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5' # Every 15 min during Indian market hours
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        block_id: [1, 2, 3, 4, 5] # Spawns 5 parallel runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Execute Scanner Block
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py ${{ matrix.block_id }}
