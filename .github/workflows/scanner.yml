name: 5M Telegram Alert Scanner & Pulse

on:
  schedule:
    # 9:10 AM IST (3:40 AM UTC), Monday to Friday - Live Scanner
    - cron: '40 3 * * 1-5'
    # 5:05 PM IST (11:35 AM UTC), Monday to Friday - Daily Summary Report
    - cron: '35 11 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: scan or report'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - report

permissions:
  contents: write

jobs:
  run-live-scanner:
    if: github.event.schedule == '40 3 * * 1-5' || github.event.inputs.action == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Master Market Scanner
        run: |
          python bot.py --scan

      - name: Save Trailing States & PnL History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add trade_state_master.json || true
          git diff --staged --quiet || git commit -m "Update intraday trading state [skip ci]"
          git push || true

  send-daily-report:
    if: github.event.schedule == '35 11 * * 1-5' || github.event.inputs.action == 'report'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Generate & Dispatch 5 PM PnL Report
        run: |
          python bot.py --report
