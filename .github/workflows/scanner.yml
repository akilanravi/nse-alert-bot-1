
name: 5M Parallel Telegram Alert Scanner

on:
  schedule:
    # 9:30 AM IST = 4:00 AM UTC
    - cron: '0 4 * * 1-5'
    # 5:05 PM IST = 11:35 AM UTC
    - cron: '35 11 * * 1-5'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: scan or report'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - report

permissions:
  contents: write
  actions: read

concurrency:
  group: yahoo-telegram-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    if: |
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 4 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'scan')

    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        group:
          - indices_banking
          - it_energy
          - auto_metals
          - pharma_fmcg
          - telecom_infra_chem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz requests

      - name: Run sector scanner
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          python bot.py --group "${{ matrix.group }}"

      - name: Upload sector state files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.group }}
          path: trade_state_*.json
          if-no-files-found: ignore
          retention-days: 7

  save-state:
    if: |
      always() &&
      (
        (github.event_name == 'schedule' &&
         github.event.schedule == '0 4 * * 1-5') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.action == 'scan')
      ) &&
      needs.scan.result != 'cancelled'

    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download sector state files
        uses: actions/download-artifact@v4
        with:
          pattern: state-*
          path: downloaded-state
          merge-multiple: true

      - name: Commit combined state files
        run: |
          set -e

          if [ -d downloaded-state ]; then
            find downloaded-state -type f -name 'trade_state_*.json' \
              -exec cp {} . \;
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add trade_state_*.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update Yahoo scanner states [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  daily-report:
    if: |
      (github.event_name == 'schedule' &&
       github.event.schedule == '35 11 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'report')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz requests

      - name: Generate daily report
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          python bot.py --report
