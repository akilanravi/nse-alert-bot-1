name: NSE 5M Alert Scanner

on:
  schedule:
    # Runs automatically every 5 minutes Monday to Friday during Indian Market hours (UTC conversion)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas pandas_ta requests

      - name: Run Alert Check
        run: |
          python bot.py
