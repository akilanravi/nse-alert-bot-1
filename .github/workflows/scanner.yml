name: 5M Telegram Alert Scanner

on:
  schedule:
    # 4:00 AM - 9:45 AM UTC = 9:30 AM - 3:15 PM IST (Mon-Fri)
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Alert Check with Trailing SL
        run: |
          python bot.py

      - name: Commit Updated Trailing State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json || true
          git commit -m "Update active trailing SL state [skip ci]" || true
          git push || true
