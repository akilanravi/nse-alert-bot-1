name: Chartink Options Automation

on:
  schedule:
    # 9:15 AM - 3:30 PM IST (03:45 - 10:00 UTC) Mon-Fri (Every 15 mins)
    - cron: '45/15 3-9 * * 1-5'
    - cron: '0 10 * * 1-5'
    
    # Daily Watchlist at 3:45 PM IST (10:15 UTC) Mon-Fri
    - cron: '15 10 * * 1-5'
    
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan Mode to execute'
        required: true
        default: 'WATCHLIST'
        type: choice
        options:
          - LIVE
          - WATCHLIST

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scanner
        env:
          SCAN_MODE: >-
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scan_mode || 
               (github.event.schedule == '15 10 * * 1-5' && 'WATCHLIST' || 'LIVE') }}
        run: python bot.py
