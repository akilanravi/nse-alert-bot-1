name: 5M Parallel Telegram Alert Scanner

on:
  schedule:
    # 9:10 AM IST (3:40 AM UTC), Monday to Friday
    - cron: '40 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-parallel-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    strategy:
      fail-fast: false
      matrix:
        group:
          - indices_banking
          - it_energy
          - auto_metals
          - pharma_fmcg
          - telecom_infra_chem

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Dedicated Sector Worker
        run: |
          python bot.py --group ${{ matrix.group }}

      - name: Save Partitioned Trailing States
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add trade_state_s1_${{ matrix.group }}.json trade_state_s2_${{ matrix.group }}.json || true
          git diff --staged --quiet || git commit -m "Save dual states for ${{ matrix.group }} [skip ci]"
          git push || true
