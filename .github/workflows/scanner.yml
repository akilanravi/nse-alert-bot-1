name: 5M Telegram Alert Scanner

on:
  schedule:
    - cron: '40 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Live Continuous Market Scanner
        run: |
          python bot.py

      - name: Save Final Session Trailing State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json || true
          git diff --staged --quiet || git commit -m "Save active state at session end [skip ci]"
          git push || true
