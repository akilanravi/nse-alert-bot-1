name: V2 Yahoo Finance Telegram Alert Scanner

on:
  schedule:
    # 09:25 IST (03:55 UTC), Mon-Fri. Python waits until 09:30 IST to scan.
    - cron: '55 3 * * 1-5'
    # 17:05 IST (11:35 UTC), Mon-Fri.
    - cron: '35 11 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: "Choose scan or report"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - report

permissions:
  contents: write

concurrency:
  group: v2-yahoo-alert-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-live-scanner:
    if: github.event.schedule == '55 3 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.action == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
      TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
      TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
      TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy pytz requests

      - name: Run V2 scanner
        run: python bot.py --scan

      - name: Commit scanner state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f trade_state_master.json ]; then
            echo "No scanner state file was produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_state_master.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update V2 scanner state [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  send-daily-report:
    if: github.event.schedule == '35 11 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.action == 'report')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
      TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
      TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
      TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip yfinance pandas numpy pytz requests

      - name: Generate daily alert report
        run: python bot.py --report
