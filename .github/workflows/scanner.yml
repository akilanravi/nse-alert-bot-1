name: Multi-Strategy Trading Bot

on:
  schedule:
    # 03:45 UTC to 09:30 UTC = 09:15 AM to 03:00 PM IST (Every 15 min, Mon-Fri)
    - cron: '*/15 3-9 * * 1-5'
    # 09:45 UTC = 03:15 PM IST (Runs the End-of-Day reconciliation report)
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-market:
    # Only run matrix scan during regular market trading hours (skip at 09:45 UTC)
    if: github.event.schedule != '45 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        block_id: [1, 2, 3, 4, 5]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Run Block Scanner
        run: python bot.py ${{ matrix.block_id }}

      - name: Persist Trade Logs to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git pull origin main --rebase || true
          if [ -f trade_log.csv ]; then
            git add trade_log.csv
            git commit -m "Auto-update trade_log.csv [skip ci]" || echo "No new trades to commit"
            git push origin main || true
          fi

  eod-summary:
    # Runs at 3:15 PM IST (09:45 UTC)
    if: github.event.schedule == '45 9 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Run 3:15 PM EOD Telegram Report
        run: python bot.py --eod
