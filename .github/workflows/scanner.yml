name: 5M Telegram Alert Scanner & Pulse

on:
  schedule:
    # 09:25 AM IST (03:55 AM UTC), Mon-Fri - Live Scanner
    - cron: '55 3 * * 1-5'
    # 05:05 PM IST (11:35 AM UTC), Mon-Fri - Daily Summary Report
    - cron: '35 11 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose execution action'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - report

permissions:
  contents: write

concurrency:
  group: nse-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-live-scanner:
    if: github.event.schedule == '55 3 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.action == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
      TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
      TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
      TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz requests

      - name: Run Master Alert Scanner
        run: python bot.py --scan

      - name: Commit & Push Trailing State
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f trade_state_master.json ]; then
            echo "No state file produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add trade_state_master.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update intraday trading state [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

  send-daily-report:
    if: github.event.schedule == '35 11 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.action == 'report')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
      TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
      TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
      TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz requests

      - name: Generate & Dispatch 5 PM PnL Report
        run: python bot.py --report
