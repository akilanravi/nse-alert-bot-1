
name: 5M Parallel Telegram Alert Scanner

on:
  schedule:
    # 9:20 AM IST (3:50 AM UTC), Monday to Friday
    - cron: '50 3 * * 1-5'
    # 5:05 PM IST (11:35 AM UTC), Monday to Friday
    - cron: '35 11 * * 1-5'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: scan or report'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - report

permissions:
  contents: write
  actions: read

concurrency:
  group: five-minute-telegram-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-parallel-scanners:
    if: |
      (github.event_name == 'schedule' &&
       github.event.schedule == '50 3 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'scan')

    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        group:
          - indices_banking
          - it_energy
          - auto_metals
          - pharma_fmcg
          - telecom_infra_chem

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz requests

      - name: Run Dedicated Sector Worker
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}

          BROKER_PROVIDER: ${{ secrets.BROKER_PROVIDER }}
          BROKER_API_KEY: ${{ secrets.BROKER_API_KEY }}
          BROKER_API_SECRET: ${{ secrets.BROKER_API_SECRET }}
          BROKER_ACCESS_TOKEN: ${{ secrets.BROKER_ACCESS_TOKEN }}

        run: |
          python bot.py --group "${{ matrix.group }}"

      - name: Upload Sector State Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-${{ matrix.group }}
          path: |
            trade_state_s1_${{ matrix.group }}.json
            trade_state_s2_${{ matrix.group }}.json
            trade_state_swing_${{ matrix.group }}.json
          if-no-files-found: ignore
          retention-days: 7

  save-scanner-state:
    if: |
      always() &&
      (
        (github.event_name == 'schedule' &&
         github.event.schedule == '50 3 * * 1-5') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.action == 'scan')
      ) &&
      needs.run-parallel-scanners.result != 'cancelled'

    needs: run-parallel-scanners
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Sector State Files
        uses: actions/download-artifact@v4
        with:
          pattern: scanner-state-*
          path: ./scanner-state
          merge-multiple: true

      - name: Commit Combined State Files
        run: |
          set -e

          if [ ! -d scanner-state ]; then
            echo "No scanner state directory found."
            exit 0
          fi

          find scanner-state -maxdepth 1 -type f -name 'trade_state_*.json' \
            -exec cp {} . \;

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add trade_state_*.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update combined scanner states [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  send-daily-report:
    if: |
      (github.event_name == 'schedule' &&
       github.event.schedule == '35 11 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'report')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz requests

      - name: Generate Daily Performance Report
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          python bot.py --report
