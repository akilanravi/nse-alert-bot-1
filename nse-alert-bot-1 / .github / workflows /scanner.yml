name: 5M Telegram Alert Scanner

on:
  schedule:
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy pytz requests

      - name: Run Alert Check
        run: |
          python bot.py

      - name: Save Trailing State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json || true
          git diff --staged --quiet || git commit -m "Update active trailing state [skip ci]"
          git push || true
